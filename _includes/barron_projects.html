<div class="barron-projects">
{% for post in site.portfolio reversed %}
  <details class="barron-project">
    <summary><span class="barron-project-title" title="{{ post.title | escape }}">{{ post.title }}</span></summary>
    <div class="barron-project-content">
      {% if post.link %}<p><a href="{{ post.link }}">Project page</a></p>{% endif %}
      {{ post.excerpt | markdownify }}
    </div>
  </details>
{% endfor %}
</div>
